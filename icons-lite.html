<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carlos' Navigator</title>
  <link rel="icon" href="assets/pic/headpic.jpg" type="image/jpeg" />
  <script>
    (function () {
      try {
        var key = "cn-nav-theme";
        var t = localStorage.getItem(key);
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #3b82f6;
      --primary-soft: #eff6ff;
      --icon-bg: #f8fafc;
      --shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
      --radius: 16px;
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --bg: #0f1419;
      --card: #171c22;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #2a3340;
      --primary: #60a5fa;
      --primary-soft: #1e293b;
      --icon-bg: #111827;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 400px at 50% -80px, color-mix(in srgb, var(--primary) 18%, transparent), transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      width: min(1100px, 94vw);
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--card);
      box-shadow: var(--shadow);
      border: 2px solid #fff;
    }

    .brand h1 {
      font-family: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 8px 8px 14px;
      box-shadow: var(--shadow);
    }

    .search-box:focus-within {
      border-color: #93c5fd;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12), var(--shadow);
    }

    .search-box .search-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
      min-width: 0;
      background: transparent;
    }

    .search-box button {
      border: none;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border-radius: 999px;
      padding: 11px 20px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-box button:hover { filter: brightness(1.06); }

    .group {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 16px 18px;
      margin-bottom: 16px;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .group-title::before {
      content: "";
      width: 4px;
      height: 1em;
      border-radius: 2px;
      background: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 10px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 8px 10px;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      border: 1px solid transparent;
      transition: 0.15s ease;
    }

    .tile:hover {
      background: var(--primary-soft);
      border-color: #dbeafe;
    }

    .tile-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--icon-bg);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-weight: 700;
      color: var(--primary);
    }

    .tile-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tile-name {
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.25;
      max-width: 100%;
      word-break: break-word;
      color: var(--text);
    }

    .view-switch {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .view-switch a {
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: var(--shadow);
    }

    .view-switch a:hover {
      color: var(--primary);
      border-color: #bfdbfe;
      background: var(--primary-soft);
    }


    .theme-toggle {
      font-size: 0.85rem;
      color: var(--muted);
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      font-family: inherit;
    }

    .theme-toggle:hover {
      color: var(--primary);
      border-color: color-mix(in srgb, var(--primary) 45%, var(--line));
      background: var(--primary-soft);
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
      .tile-icon { width: 44px; height: 44px; }
      .brand h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="view-switch">
      <button type="button" class="theme-toggle" id="btnTheme" title="切换浅色/深色">深色</button>
      <a href="text.html" title="切换到纯文字版">纯文字版</a>
      <a href="index.html" title="切换到有图完整版">有图版</a>
    </div>
    <header>
      <div class="brand">
        <img src="assets/pic/headpic.jpg" alt="avatar" width="48" height="48" />
        <h1 id="siteTitle">Carlos' Navigator</h1>
      </div>
      <form class="search-box" id="searchForm" action="https://www.google.com/search" method="get" target="_blank" rel="noopener">
        <img class="search-logo" src="assets/logos/google.png" alt="Google" width="28" height="28" />
        <input type="search" name="q" placeholder="Google 搜索…" autocomplete="off" />
        <button type="submit">搜索</button>
      </form>
    </header>

    <main id="main"></main>
  </div>

  <script src="data.js?v=20260808a"></script>
  <script>
    (function () {
      // Lightweight URL scramble (XOR+base64). Stops casual GitHub text search;
      // not strong crypto — key is in this file on purpose for zero-friction open.
      var OBF_KEY = "cn-nav-k7";
      function resolveUrl(raw) {
        if (!raw) return "#";
        if (raw.indexOf("obf1:") !== 0) return raw;
        try {
          var bin = atob(raw.slice(5));
          var out = "";
          for (var i = 0; i < bin.length; i++) {
            out += String.fromCharCode(bin.charCodeAt(i) ^ OBF_KEY.charCodeAt(i % OBF_KEY.length));
          }
          return out;
        } catch (e) {
          return "#";
        }
      }

      const data = window.NAV_DATA || { title: "Carlos' Navigator", groups: [] };
      document.getElementById("siteTitle").textContent = data.title || "Carlos' Navigator";
      document.title = (data.title || "Carlos' Navigator") + " · 有图精简";


      var THEME_KEY = "cn-nav-theme";
      function currentTheme() {
        var t = document.documentElement.getAttribute("data-theme");
        return t === "dark" ? "dark" : "light";
      }
      function applyTheme(theme) {
        var next = theme === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        var btn = document.getElementById("btnTheme");
        if (btn) btn.textContent = next === "dark" ? "浅色" : "深色";
      }
      applyTheme(currentTheme());
      var themeBtn = document.getElementById("btnTheme");
      if (themeBtn) {
        themeBtn.addEventListener("click", function () {
          applyTheme(currentTheme() === "dark" ? "light" : "dark");
        });
      }

      const main = document.getElementById("main");

      (data.groups || []).forEach(function (group) {
        const section = document.createElement("section");
        section.className = "group";

        const title = document.createElement("h2");
        title.className = "group-title";
        title.textContent = group.name || "";
        section.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "grid";

        (group.items || []).forEach(function (item) {
          const a = document.createElement("a");
          a.className = "tile";
          const href = resolveUrl(item.url);
          a.href = href;
          const isHttp = /^https?:\/\//i.test(href);
          if (isHttp) {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }

          const icon = document.createElement("div");
          icon.className = "tile-icon";
          if (item.logo) {
            const img = document.createElement("img");
            img.src = item.logo;
            img.alt = item.name || "";
            img.loading = "lazy";
            img.onerror = function () {
              img.remove();
              icon.textContent = (item.name || "?").charAt(0);
            };
            icon.appendChild(img);
          } else {
            icon.textContent = (item.name || "?").charAt(0);
          }

          const name = document.createElement("div");
          name.className = "tile-name";
          name.textContent = item.name || "";

          a.appendChild(icon);
          a.appendChild(name);
          grid.appendChild(a);
        });

        section.appendChild(grid);
        main.appendChild(section);
      });
    })();
  </script>
</body>
</html>
