<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carlos' Navigator</title>
  <link rel="icon" href="assets/pic/headpic.jpg" type="image/jpeg" />
  <script>
    (function () {
      try {
        var key = "cn-nav-theme";
        var t = localStorage.getItem(key);
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
        var p = localStorage.getItem("cn-nav-palette");
        var ok = { default: 1, github: 1, reddit: 1, twitter: 1 };
        if (!ok[p]) p = "default";
        document.documentElement.setAttribute("data-palette", p);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #3b82f6;
      --primary-soft: #eff6ff;
      --icon-bg: #f8fafc;
      --shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
      --radius: 16px;
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --bg: #0f1419;
      --card: #171c22;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --line: #2a3340;
      --primary: #60a5fa;
      --primary-soft: #1e293b;
      --icon-bg: #111827;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }

    /* ----- Color palettes (independent of light/dark) ----- */
    /* GitHub Primer-ish: neutral canvas, green primary actions, blue links */
    html[data-palette="github"] {
      --green: #1f883d;
      --green-dark: #1a7f37;
      --green-soft: #dafbe1;
      --body: #f6f8fa;
      --bg-top: #ffffff;
      --surface: #ffffff;
      --surface-2: #f6f8fa;
      --fill: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --cat: #1a7f37;
      --link: #0969da;
      --hover: #0550ae;
      --line: #d1d9e0;
      --line-soft: #e6eaef;
      --chip: #1f2328;
      --meta: #59636e;
      --rank: #818b98;
      --day: #9a6700;
      --night: #0969da;
      --focus: rgba(9, 105, 218, 0.2);
      --engine-border: #54aeff;
      color-scheme: light;
    }
    html[data-palette="github"][data-theme="dark"] {
      --green: #238636;
      --green-dark: #3fb950;
      --green-soft: #12261e;
      --body: #0d1117;
      --bg-top: #010409;
      --surface: #161b22;
      --surface-2: #151b23;
      --fill: #161b22;
      --text: #f0f6fc;
      --muted: #9198a1;
      --cat: #3fb950;
      --link: #4493f8;
      --hover: #79c0ff;
      --line: #3d444d;
      --line-soft: #212830;
      --chip: #f0f6fc;
      --meta: #9198a1;
      --rank: #6e7681;
      --day: #d29922;
      --night: #79c0ff;
      --focus: rgba(31, 111, 235, 0.28);
      --engine-border: #1f6feb;
      color-scheme: dark;
    }

    html[data-palette="reddit"] {
      --green: #ff4500;
      --green-dark: #d93900;
      --green-soft: #fff1ec;
      --body: #dae0e6;
      --bg-top: #edeff1;
      --surface: #ffffff;
      --surface-2: #f6f7f8;
      --fill: #ffffff;
      --text: #1c1c1c;
      --muted: #7c7c7c;
      --cat: #ff4500;
      --link: #1c1c1c;
      --hover: #0079d3;
      --line: #ccc;
      --line-soft: #eDEFF1;
      --chip: #1a1a1b;
      --meta: #7c7c7c;
      --rank: #878a8c;
      --day: #ff8717;
      --night: #0079d3;
      --focus: rgba(255, 69, 0, 0.16);
      --engine-border: #ff8717;
      color-scheme: light;
    }
    html[data-palette="reddit"][data-theme="dark"] {
      --green: #ff4500;
      --green-dark: #ff8717;
      --green-soft: #3d1a10;
      --body: #030303;
      --bg-top: #0a0a0a;
      --surface: #1a1a1b;
      --surface-2: #272729;
      --fill: #1a1a1b;
      --text: #d7dadc;
      --muted: #818384;
      --cat: #ff8717;
      --link: #d7dadc;
      --hover: #72cdf6;
      --line: #343536;
      --line-soft: #272729;
      --chip: #d7dadc;
      --meta: #818384;
      --rank: #6a6b6c;
      --day: #ffb000;
      --night: #72cdf6;
      --focus: rgba(255, 69, 0, 0.22);
      --engine-border: #ff4500;
      color-scheme: dark;
    }

    html[data-palette="twitter"] {
      --green: #1d9bf0;
      --green-dark: #1a8cd8;
      --green-soft: #e8f5fd;
      --body: #f7f9f9;
      --bg-top: #ffffff;
      --surface: #ffffff;
      --surface-2: #f7f9f9;
      --fill: #ffffff;
      --text: #0f1419;
      --muted: #536471;
      --cat: #1d9bf0;
      --link: #0f1419;
      --hover: #f4212e;
      --line: #eff3f4;
      --line-soft: #f7f9f9;
      --chip: #0f1419;
      --meta: #536471;
      --rank: #8b98a5;
      --day: #ff7a00;
      --night: #1d9bf0;
      --focus: rgba(29, 155, 240, 0.18);
      --engine-border: #8ecdf8;
      color-scheme: light;
    }
    html[data-palette="twitter"][data-theme="dark"] {
      --green: #1d9bf0;
      --green-dark: #1d9bf0;
      --green-soft: #031525;
      --body: #000000;
      --bg-top: #000000;
      --surface: #16181c;
      --surface-2: #1d1f23;
      --fill: #16181c;
      --text: #e7e9ea;
      --muted: #71767b;
      --cat: #1d9bf0;
      --link: #e7e9ea;
      --hover: #f4212e;
      --line: #2f3336;
      --line-soft: #1d1f23;
      --chip: #e7e9ea;
      --meta: #71767b;
      --rank: #6e767d;
      --day: #ffd400;
      --night: #1d9bf0;
      --focus: rgba(29, 155, 240, 0.22);
      --engine-border: #1d9bf0;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 400px at 50% -80px, color-mix(in srgb, var(--primary) 18%, transparent), transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      width: min(1100px, 94vw);
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--card);
      box-shadow: var(--shadow);
      border: 2px solid #fff;
    }

    .brand h1 {
      font-family: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(640px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 8px 8px 14px;
      box-shadow: var(--shadow);
    }

    .search-box:focus-within {
      border-color: #93c5fd;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12), var(--shadow);
    }

    .search-box .search-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
      min-width: 0;
      background: transparent;
    }

    .search-box button {
      border: none;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border-radius: 999px;
      padding: 11px 20px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-box button:hover { filter: brightness(1.06); }

    .group {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 16px 18px;
      margin-bottom: 16px;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .group-title::before {
      content: "";
      width: 4px;
      height: 1em;
      border-radius: 2px;
      background: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 10px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 8px 10px;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      border: 1px solid transparent;
      transition: 0.15s ease;
    }

    .tile:hover {
      background: var(--primary-soft);
      border-color: #dbeafe;
    }

    .tile-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--icon-bg);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-weight: 700;
      color: var(--primary);
    }

    .tile-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tile-name {
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.25;
      max-width: 100%;
      word-break: break-word;
      color: var(--text);
    }

    .view-switch {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .view-switch a {
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 6px 14px;
      box-shadow: var(--shadow);
    }

    .view-switch a:hover {
      color: var(--primary);
      border-color: #bfdbfe;
      background: var(--primary-soft);
    }


    .theme-toggle,
    .palette-select {
      border: 1px solid var(--line);
      background: var(--fill, var(--card));
      color: var(--muted);
      font-size: 11px;
      padding: 0 8px;
      height: 24px;
      line-height: 22px;
      cursor: pointer;
      font-family: inherit;
      border-radius: 8px;
      white-space: nowrap;
    }

    .palette-select {
      max-width: 108px;
      padding-right: 4px;
      appearance: auto;
    }

    .theme-toggle:hover,
    .palette-select:hover {
      color: var(--green-dark, var(--primary));
      border-color: var(--engine-border, var(--primary));
      background: var(--green-soft, var(--primary-soft));
    }

    /* Map shared palette tokens onto icons-lite variables */
    html[data-palette="github"],
    html[data-palette="reddit"],
    html[data-palette="twitter"] {
      --bg: var(--body);
      --card: var(--surface);
      --primary: var(--green);
      --primary-soft: var(--green-soft);
      --icon-bg: var(--fill);
    }
    /* GitHub lite: blue primary accent on tiles (closer to Primer accent links) */
    html[data-palette="github"] {
      --primary: #0969da;
      --primary-soft: #ddf4ff;
    }
    html[data-palette="github"][data-theme="dark"] {
      --primary: #4493f8;
      --primary-soft: #121d2f;
      --bg: #0d1117;
      --card: #161b22;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
      .tile-icon { width: 44px; height: 44px; }
      .brand h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="view-switch">
      <select class="palette-select" id="paletteSelect" title="切换色系" aria-label="色系">
        <option value="default">默认绿</option>
        <option value="github">GitHub</option>
        <option value="reddit">Reddit</option>
        <option value="twitter">Twitter</option>
      </select>
      <button type="button" class="theme-toggle" id="btnTheme" title="切换浅色/深色">深色</button>
      <a href="text.html" title="切换到纯文字版">纯文字版</a>
      <a href="index.html" title="切换到有图完整版">有图版</a>
    </div>
    <header>
      <div class="brand">
        <img src="assets/pic/headpic.jpg" alt="avatar" width="48" height="48" />
        <h1 id="siteTitle">Carlos' Navigator</h1>
      </div>
      <form class="search-box" id="searchForm" action="https://www.google.com/search" method="get" target="_blank" rel="noopener">
        <img class="search-logo" src="assets/logos/google.png" alt="Google" width="28" height="28" />
        <input type="search" name="q" placeholder="Google 搜索…" autocomplete="off" />
        <button type="submit">搜索</button>
      </form>
    </header>

    <main id="main"></main>
  </div>

  <script src="data.js?v=20260808o"></script>
  <script>
    (function () {
      // Lightweight URL scramble (XOR+base64). Stops casual GitHub text search;
      // not strong crypto — key is in this file on purpose for zero-friction open.
      var OBF_KEY = "cn-nav-k7";
      function resolveUrl(raw) {
        if (!raw) return "#";
        if (raw.indexOf("obf1:") !== 0) return raw;
        try {
          var bin = atob(raw.slice(5));
          var out = "";
          for (var i = 0; i < bin.length; i++) {
            out += String.fromCharCode(bin.charCodeAt(i) ^ OBF_KEY.charCodeAt(i % OBF_KEY.length));
          }
          return out;
        } catch (e) {
          return "#";
        }
      }

      const data = window.NAV_DATA || { title: "Carlos' Navigator", groups: [] };
      document.getElementById("siteTitle").textContent = data.title || "Carlos' Navigator";
      document.title = (data.title || "Carlos' Navigator") + " · 有图精简";


      /* ---------- Theme (light / dark) + palette (GitHub / Reddit / Twitter) ---------- */
      var THEME_KEY = "cn-nav-theme";
      var PALETTE_KEY = "cn-nav-palette";
      var PALETTES = ["default", "github", "reddit", "twitter"];

      function currentTheme() {
        var t = document.documentElement.getAttribute("data-theme");
        return t === "dark" ? "dark" : "light";
      }
      function applyTheme(theme) {
        var next = theme === "dark" ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", next);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        var btn = document.getElementById("btnTheme");
        if (btn) btn.textContent = next === "dark" ? "浅色" : "深色";
      }
      applyTheme(currentTheme());
      var themeBtn = document.getElementById("btnTheme");
      if (themeBtn) {
        themeBtn.addEventListener("click", function () {
          applyTheme(currentTheme() === "dark" ? "light" : "dark");
        });
      }

      function currentPalette() {
        var p = document.documentElement.getAttribute("data-palette") || "default";
        return PALETTES.indexOf(p) >= 0 ? p : "default";
      }
      function applyPalette(name) {
        var next = PALETTES.indexOf(name) >= 0 ? name : "default";
        document.documentElement.setAttribute("data-palette", next);
        try { localStorage.setItem(PALETTE_KEY, next); } catch (e) {}
        var sel = document.getElementById("paletteSelect");
        if (sel && sel.value !== next) sel.value = next;
      }
      applyPalette(currentPalette());
      var paletteSel = document.getElementById("paletteSelect");
      if (paletteSel) {
        paletteSel.addEventListener("change", function () {
          applyPalette(paletteSel.value);
        });
      }


      const main = document.getElementById("main");

      (data.groups || []).forEach(function (group) {
        const section = document.createElement("section");
        section.className = "group";

        const title = document.createElement("h2");
        title.className = "group-title";
        title.textContent = group.name || "";
        section.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "grid";

        (group.items || []).forEach(function (item) {
          const a = document.createElement("a");
          a.className = "tile";
          const href = resolveUrl(item.url);
          a.href = href;
          const isHttp = /^https?:\/\//i.test(href);
          if (isHttp) {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }

          const icon = document.createElement("div");
          icon.className = "tile-icon";
          if (item.logo) {
            const img = document.createElement("img");
            img.src = item.logo;
            img.alt = item.name || "";
            img.loading = "lazy";
            img.onerror = function () {
              img.remove();
              icon.textContent = (item.name || "?").charAt(0);
            };
            icon.appendChild(img);
          } else {
            icon.textContent = (item.name || "?").charAt(0);
          }

          const name = document.createElement("div");
          name.className = "tile-name";
          name.textContent = item.name || "";

          a.appendChild(icon);
          a.appendChild(name);
          grid.appendChild(a);
        });

        section.appendChild(grid);
        main.appendChild(section);
      });
    })();
  </script>
</body>
</html>
