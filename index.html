<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carlos' Nav</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #3b82f6;
      --primary-soft: #eff6ff;
      --shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 400px at 50% -80px, rgba(59, 130, 246, 0.12), transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      width: min(1100px, 94vw);
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .brand h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(640px, 100%);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 8px 8px 14px;
      box-shadow: var(--shadow);
    }

    .search-box:focus-within {
      border-color: #93c5fd;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12), var(--shadow);
    }

    .search-box .search-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1rem;
      min-width: 0;
      background: transparent;
    }

    .search-box button {
      border: none;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border-radius: 999px;
      padding: 11px 20px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-box button:hover { filter: brightness(1.06); }

    .group {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px 16px 18px;
      margin-bottom: 16px;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .group-title::before {
      content: "";
      width: 4px;
      height: 1em;
      border-radius: 2px;
      background: var(--primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 10px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px 8px 10px;
      border-radius: 14px;
      text-decoration: none;
      color: inherit;
      border: 1px solid transparent;
      transition: 0.15s ease;
    }

    .tile:hover {
      background: var(--primary-soft);
      border-color: #dbeafe;
    }

    .tile-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-weight: 700;
      color: var(--primary);
    }

    .tile-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .tile-name {
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.25;
      max-width: 100%;
      word-break: break-word;
      color: #374151;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
      .tile-icon { width: 44px; height: 44px; }
      .brand h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="assets/logo.svg" alt="" />
        <h1 id="siteTitle">Carlos' Nav</h1>
      </div>
      <form class="search-box" id="searchForm" action="https://www.google.com/search" method="get" target="_blank" rel="noopener">
        <img class="search-logo" src="assets/logos/google.png" alt="Google" width="28" height="28" />
        <input type="search" name="q" placeholder="Google 搜索…" autocomplete="off" />
        <button type="submit">搜索</button>
      </form>
    </header>

    <main id="main"></main>
  </div>

  <script src="data.js?v=20260806c"></script>
  <script>
    (function () {
      const data = window.NAV_DATA || { title: "Carlos' Nav", groups: [] };
      document.getElementById("siteTitle").textContent = data.title || "Carlos' Nav";
      document.title = data.title || "Carlos' Nav";

      const main = document.getElementById("main");

      (data.groups || []).forEach(function (group) {
        const section = document.createElement("section");
        section.className = "group";

        const title = document.createElement("h2");
        title.className = "group-title";
        title.textContent = group.name || "";
        section.appendChild(title);

        const grid = document.createElement("div");
        grid.className = "grid";

        (group.items || []).forEach(function (item) {
          const a = document.createElement("a");
          a.className = "tile";
          a.href = item.url || "#";
          const isHttp = /^https?:\/\//i.test(item.url || "");
          if (isHttp) {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }

          const icon = document.createElement("div");
          icon.className = "tile-icon";
          if (item.logo) {
            const img = document.createElement("img");
            img.src = item.logo;
            img.alt = item.name || "";
            img.loading = "lazy";
            img.onerror = function () {
              img.remove();
              icon.textContent = (item.name || "?").charAt(0);
            };
            icon.appendChild(img);
          } else {
            icon.textContent = (item.name || "?").charAt(0);
          }

          const name = document.createElement("div");
          name.className = "tile-name";
          name.textContent = item.name || "";

          a.appendChild(icon);
          a.appendChild(name);
          grid.appendChild(a);
        });

        section.appendChild(grid);
        main.appendChild(section);
      });
    })();
  </script>
</body>
</html>
